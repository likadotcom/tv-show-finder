<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">

    <main class="max-w-5xl mx-auto px-6 py-12">

        <h2 id="signInText" class="text-4xl font-bold text-center">
            Sign in
        </h2>

        <p id="message" class="text-slate-400 text-center mt-3">
            Enter your username and password.
        </p>

        <div class="grid grid-cols-2 gap-4 max-w-xs mx-auto mt-8">
            <input id="username" type="text" placeholder="Username" class="flex-1 col-span-full bg-slate-800 border border-slate-700 rounded-lg
                    px-4 py-3 outline-none focus:border-blue-500">
            <input id="password" type="password" placeholder="Password" class="flex-1 col-span-full bg-slate-800 border border-slate-700 rounded-lg
                    px-4 py-3 outline-none focus:border-blue-500">
        </div>

        <p id="signInMessage" class="text-red-400 text-center mt-6"></p>

        <div class="flex gap-2 justify-center mt-8">
            <button id="signInBtn" class="bg-blue-600 hover:bg-blue-500 mx-auto px-6 py-3 rounded-lg font-semibold">
                Sign in
            </button>

    </main>
    <script src="steamfinder_signin.js"></script>
</body>

</html>
